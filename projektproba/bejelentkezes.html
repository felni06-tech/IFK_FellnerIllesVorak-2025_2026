<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <header> <!-- navigation bar -->
        <nav>
            <div class="nav-container">
                <a href="index.html"><h1>Időpontfoglaló</h1></a>
                <div id="nav-links">
                    <a href="bejelentkezes.html">Bejelentkezés</a> <!-- Login Gomb-->
                    <a href="regisztracio.html">Regisztráció</a> <!-- Register Gomb-->
                </div>
            </div>
        </nav>
    </header>

    <main>
         <section id="hero-section" class="hero">
            <div class="auth-container">
                <div class="auth-form">
                    <h2>Bejelentkezés</h2>
                    <form id="login">
                        <div class="form-group">
                            <label for="login-email">Email cím</label>
                            <input id="login-email" type="email" name="email" placeholder="pelda@email.com" required>
                        </div>

                        <div class="form-group">
                            <label for="login-password">Jelszó</label>
                            <input id="login-password" type="password" name="password" placeholder="••••••••" required>
                        </div>

                        <div class="form-group">
                            <label for="login-role">Szerepkör</label>
                            <select id="login-role" name="role" required>
                                <option value="user">Felhasználó</option>
                                <option value="provider">Szolgáltató</option>
                            </select>
                        </div>

                        <button type="submit">Bejelentkezés</button>
                    </form>
                    <p>Nem regisztráltál még? <a href="regisztracio.html">Regisztráció</a></p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
